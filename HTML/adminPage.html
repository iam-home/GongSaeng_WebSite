<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../JS/Login.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['Space Mono', 'monospace'] },
          colors: {
            bg: '#f5faf6', fg: '#1a2e1f', card: '#ffffff', brand: '#2d7a4f',
            accent: '#3aab7a', border: '#d0e2d6', muted: '#6b8f78',
          },
        },
      },
    }
  </script>
</head>
<body class="bg-bg font-sans antialiased text-fg">

  <header class="sticky top-0 z-50 border-b border-border bg-white/80 backdrop-blur-md">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <div class="flex items-center gap-4">
        <a href="../index.html" class="text-brand hover:text-accent transition-colors">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        </a>
        <h1 class="font-mono text-lg font-bold tracking-tighter uppercase">Admin Control Center</h1>
      </div>
      <div class="flex items-center gap-2">
        <span class="rounded-full bg-brand/10 px-3 py-1 text-xs font-bold text-brand uppercase tracking-widest">Active</span>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-6 py-12">
    <div class="mb-12 grid gap-6 md:grid-cols-3">
      <div class="rounded-2xl border border-border bg-white p-6 shadow-sm">
        <p class="font-mono text-xs font-bold uppercase tracking-widest text-muted">Total</p>
        <p id="totalCount" class="mt-2 text-4xl font-bold text-brand">0</p>
      </div>
    </div>

    <div class="overflow-hidden rounded-2xl border border-border bg-white shadow-sm">
      <div class="border-b border-border bg-bg/50 px-6 py-4">
        <h2 class="font-mono text-sm font-bold uppercase tracking-widest">Inbound Records</h2>
      </div>
      
      <div id="Data" class="divide-y divide-border">
        <div class="flex items-center justify-center py-20">
          <p class="animate-pulse text-muted">데이터를 불러오는 중입니다...</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    async function admin() {
      let { data: records, error } = await client
        .from("Suggest")
        .select("*")
        .order('created_at', { ascending: false });

      if (error) {
          console.error("Error fetching data:", error);
          document.querySelector("#Data").innerHTML = `<p class="p-10 text-center text-red-500">데이터 로드 실패: ${error.message}</p>`;
          return;
      }

      document.getElementById('totalCount').innerText = records.length;

      let tag = "";
      if (records.length === 0) {
          tag = `<div class="p-20 text-center text-muted">등록된 글이 없습니다.</div>`;
      } else {
          for (let i = 0; i < records.length; i++) {
              const item = records[i];
              const date = new Date(item.created_at).toLocaleDateString('ko-KR', {
                  month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
              });

              const userLabel = item.is_guest 
                  ? `<span class="rounded bg-gray-100 px-2 py-0.5 text-[10px] font-bold text-gray-500 uppercase tracking-tighter">Guest</span>`
                  : `<span class="rounded bg-brand/10 px-2 py-0.5 text-[10px] font-bold text-brand uppercase tracking-tighter">Member</span>`;

              tag += `
                <div class="group p-6 hover:bg-bg/30 transition-colors">
                  <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
                    <div class="flex-1">
                      <div class="mb-2 flex items-center gap-2">
                        ${userLabel}
                        <span class="text-xs font-mono text-muted">${date}</span>
                      </div>
                      <h3 class="text-lg font-medium leading-relaxed text-fg">${item.body}</h3>
                      ${item.contact_info ? `<div class="mt-3 flex items-center gap-2 font-mono text-sm text-accent"><svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>${item.contact_info}</div>` : ''}
                    </div>
                    <div class="flex gap-2">
                      <button onclick="deleteRecord('${item.id}')" class="rounded-md border border-border p-2 text-muted hover:bg-red-50 hover:text-red-600 transition-colors">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                      </button>
                    </div>
                  </div>
                </div>`;
          }
      }
      document.querySelector("#Data").innerHTML = tag;
    }

    async function deleteRecord(id) {
        if(confirm("삭제하시겠습니까?")) {
            const { error } = await client.from('Suggest').delete().eq('id', id).select();
            if(!error) {
                alert("삭제되었습니다.");
                admin();
            }
        }
    }

    admin();
  </script>
</body>
</html>
