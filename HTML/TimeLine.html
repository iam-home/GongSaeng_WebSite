<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activities | 공생</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  
  <script src="../JS/Login.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['Space Mono', 'monospace'] },
          colors: {
            bg: '#f5faf6', fg: '#1a2e1f', card: '#ffffff', 'card-fg': '#1a2e1f',
            brand: '#2d7a4f', 'brand-fg': '#f5faf6', secondary: '#e8f2eb',
            'secondary-fg': '#1f3d28', muted: '#6b8f78', accent: '#3aab7a',
            border: '#d0e2d6', input: '#dbe9e0', ring: '#2d7a4f',
          },
        },
      },
    }
  </script>
  <style>
    body { background-color: #f5faf6; color: #1a2e1f; }
    .grid-bg {
      background-image: linear-gradient(rgba(26,46,31,0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(26,46,31,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .dropdown-menu { display: none; }
    .dropdown-menu.show { display: block; }
  </style>
</head>
<body class="font-sans antialiased">

  <header class="sticky top-0 z-50 border-b border-border bg-bg/80 backdrop-blur-md">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <a href="../index.html" class="flex items-center gap-2">
        <div class="relative flex items-center justify-center text-brand">
          <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.9C15.5 4.9 17 3.5 19 2c1 2 2 4.5 1 8-1 3.5-3.5 6-7 8.08"/><path d="M5 19a7 7 0 0 1 3.3-12"/></svg>
        </div>
        <span class="font-mono text-lg font-bold text-fg">공생</span>
      </a>
      <nav class="hidden items-center gap-1 md:flex">
        <a href="../index.html" class="rounded-md px-3 py-2 text-sm font-medium text-muted hover:bg-secondary">Home</a>
        <a href="./faq.html" class="rounded-md px-3 py-2 text-sm font-medium text-muted hover:bg-secondary">FAQ</a>
        <a href="./ToDo.html" class="rounded-md px-3 py-2 text-sm font-medium text-muted hover:bg-secondary">Schedule</a>
        <a href="./TimeLine.html" class="rounded-md bg-brand px-3 py-2 text-sm font-medium text-brand-fg">Activities</a>
        <a href="./Suggest.html" class="rounded-md px-3 py-2 text-sm font-medium text-muted hover:bg-secondary">Suggestions</a>
        <button onclick="Logout()" id="authBtn" class="ml-3 rounded-md border border-brand bg-bg px-4 py-2 text-sm font-medium text-brand hover:bg-brand hover:text-brand-fg transition-colors">Logout</button>
      </nav>
    </div>
  </header>

  <main class="min-h-screen">
    <section class="bg-bg py-16 md:py-24 grid-bg">
      <div class="mx-auto max-w-4xl px-6">
        <div class="flex flex-col items-center text-center mb-12">
          <div class="flex h-12 w-12 items-center justify-center rounded-lg bg-brand/10">
            <svg class="h-6 w-6 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          </div>
          <h1 class="mt-6 text-3xl font-bold tracking-tight text-fg md:text-4xl">활동 기록</h1>
          <p class="mt-3 text-muted italic">"공생의 발자취를 기록합니다."</p>
          
          <button id="adminWriteBtn" onclick="location.href='WRITE.html?from=TimeLine';" class="mt-8 hidden rounded-full bg-brand px-6 py-2.5 text-sm font-bold text-brand-fg shadow-lg hover:scale-105 transition-all">
            + 새로운 기록 추가
          </button>
        </div>

        <div class="grid gap-8" id="Data">
          <div class="py-20 text-center text-muted">기록을 불러오는 중...</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="border-t border-border bg-secondary/50 py-12 text-center">
    <p class="font-mono text-xs text-muted">&copy; 2026 EcoMech. All rights reserved.</p>
  </footer>

  <script>
    const adminEmails = ["SCRET_REMOVED"];

    async function TimeLineDB() {
      const { data: { session } } = await client.auth.getSession();
      const isAdmin = session && adminEmails.includes(session.user.email);

      if (isAdmin) {
        document.getElementById('adminWriteBtn').classList.remove('hidden');
      }

      const { data, error } = await client
        .from('TimeLine')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error('데이터 조회 에러:', error);
        return;
      }

      let tag = "";
      if (data.length === 0) {
        tag = `<div class="text-center py-20 text-muted italic">아직 등록된 활동 기록이 없습니다.</div>`;
      } else {
        data.forEach((item, i) => {
          tag += `
            <div class="group relative rounded-2xl border border-border bg-card p-8 shadow-sm transition-all hover:shadow-md">
              <div class="flex flex-col gap-4">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <span class="h-2 w-2 rounded-full bg-brand"></span>
                    <span class="font-mono text-xs font-bold uppercase tracking-wider text-muted">Activity Log</span>
                  </div>
                  
                  ${isAdmin ? `
                    <div class="relative">
                      <button onclick="toggleMenu(${i})" class="rounded-full p-1 hover:bg-secondary text-muted">
                        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"/></svg>
                      </button>
                      <div id="menu-${i}" class="dropdown-menu absolute right-0 mt-2 w-24 rounded-md border border-border bg-white shadow-xl z-10">
                        <button onclick="deletePost(${item.id})" class="w-full px-4 py-2 text-left text-xs font-bold text-red-500 hover:bg-red-50">삭제</button>
                      </div>
                    </div>
                  ` : ''}
                </div>
                
                <div class="prose prose-sm max-w-none text-fg leading-relaxed">
                  ${item.body.replace(/\n/g, '<br>')}
                </div>
              </div>
            </div>`;
        });
      }
      document.querySelector("#Data").innerHTML = tag;
    }

    function toggleMenu(index) {
      const allMenus = document.querySelectorAll('.dropdown-menu');
      const targetMenu = document.getElementById(`menu-${index}`);
      
      allMenus.forEach(m => { if(m !== targetMenu) m.classList.remove('show'); });
      targetMenu.classList.toggle('show');
    }

    async function deletePost(id) {
      if (!confirm("이 기록을 삭제하시겠습니까?")) return;
      const { error } = await client.from('TimeLine').delete().eq('id', id);
      if (error) alert("삭제 실패: " + error.message);
      else {
        alert("기록이 삭제되었습니다.");
        TimeLineDB();
      }
    }

    function Logout() {
      if(typeof LoginPage === 'function') {
        LoginPage(); 
      } else {
        client.auth.signOut().then(() => { location.href = './Login.html'; });
      }
    }

    async function init() {
      const isLogin = await checkLogin();
      if (!isLogin) {
        alert("로그인이 필요한 페이지입니다.");
        window.history.back();
        return;
      }
      TimeLineDB();
    }

    window.onclick = (e) => {
      if (!e.target.closest('button')) {
        document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
      }
    };

    init();
  </script>
</body>
</html>
