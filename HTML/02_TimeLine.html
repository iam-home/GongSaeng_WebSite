    <script>
    
    async function TimeLineDB() {
    const { data: { session } } = await client.auth.getSession();
    const adminEmails = ["SCRET_REMOVED"];
    const isAdmin = session && adminEmails.includes(session.user.email);

    const { data, error } = await client.from('TimeLine').select('*');

    if (error) {
        console.error('데이터 조회 에러:', error);
        return;
    }

    let tag = "";
    for (let i = 0; i < data.length; i++) {
        tag += `<div class="post-item" style="position: relative; margin: 20px 0; border: 1px solid #ddd; padding: 15px;"> 
          <p>${data[i].body}</p>
            
            <div class="menu-container" style="position: absolute; top: 10px; right: 10px;">
                <button onclick="toggleMenu(${i})" style="border:none; background:none; cursor:pointer; font-size:20px;">⋮</button>
                
                <div id="menu-${i}" class="dropdown-menu" style="display:none; position: absolute; right: 0; background: white; border: 1px solid #ccc; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); z-index: 10;">
                    
                    

                    ${(isAdmin) ? `
                        <button onclick="deleteToDo(${data[i].id})" style="display:block; width:100%; padding: 5px 10px; border:none; background:none; cursor:pointer; color:red;">삭제</button>
                    ` : ''}

                </div>
            </div>
        </div>`;
    } // ${isAdmin ? `<button onclick="updateToDo()" style="display:block; width:100%; padding: 5px 10px; border:none; background:none; cursor:pointer;">수정</button>` : ''}
    document.querySelector("#Data").innerHTML = tag;
}

function toggleMenu(index) {
    const menu = document.querySelector(`#menu-${index}`);
    if (menu.style.display === "none") {
        menu.style.display = "block";
    } else {
        menu.style.display = "none";
    }
}

async function deleteToDo(id) {
    if (!confirm("정말 삭제하시겠습니까?")) return;
    
    const { error } = await client.from('TimeLine').delete().eq('id', id);
    
    if (error) {
        alert("삭제 실패: " + error.message);
    } else {
        alert("삭제되었습니다.");
        TimeLineDB();
    }
}

window.onclick = function(event) {
    if (!event.target.matches('button')) {
        const dropdowns = document.getElementsByClassName("dropdown-menu");
        for (let i = 0; i < dropdowns.length; i++) {
            dropdowns[i].style.display = "none";
        }
    }
}

      TimeLineDB();

isadmin();
