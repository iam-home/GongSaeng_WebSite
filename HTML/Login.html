<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>공생</title>
    <script src="../JS/Login.js"></script>
</head>
<body>
    
    <div>
        <h1>Login</h1>
        <h4><input type="email" id="ID" placeholder="아아디"></h4>
        <h4><input type="password" id="password" placeholder="비밀번호"></h4>
        <h4><input type="button" value="로그인" id="login" onclick="fuckingMessage()"></h4>
        
        <!-- <a href="WhenForgotPassword">forgot your Password?</a> -->
        <!-- 아마도 개발 예정. 지금 비번 찾기 페이지 없음. 필요하면 만드셈 -->

        <h1>Create Account</h1>
        <h4><input type="email" id="signup-id" placeholder="아이디"></h4>
        <h4><input type="password" id="signup-password" placeholder="비밀번호"></h4>
        <h4><input type="password" id="password-confirm" placeholder="비밀번호 재입력"></h4><br>
        <h4><input type="password" id="register-code" placeholder="가입 코드"></h4>
        <button id="signup-btn" onclick="signUp()">회원가입</button>

    </div>

    <script>

        async function fuckingMessage() {
            const isLogin = await checkLogin();
            if (isLogin) {
                randomStart();
            }
        }

    async function signUp() {
    const id = document.querySelector("#signup-id").value.trim();
    const email = `${id}@gmail.com`;
    const password = document.querySelector("#signup-password").value;
    const confirm = document.querySelector("#password-confirm").value;
    const code = document.querySelector("#register-code").value;

    if (!email || !password) {
        alert("아이디와 비밀번호를 모두 입력해주세요.");
        return;
    }

    if (password !== confirm) {
        alert("비밀번호가 일치하지 않습니다.");
        return;
    }

    if (code !== "SCRET_REMOVED") {
        alert("잘못된 가입 코드");
        return;
    }

    const { data, error } = await client.auth.signUp({
        email: email,
        password: password,
    });

    if (error) {
        console.error("회원가입 에러:", error.message);
        alert("회원가입 실패: " + error.message);
    } else {
        console.log("회원가입 성공:", data);
        if (data.user && data.merged_user === undefined) {
             alert("회원가입 성공");
        } else {
             alert("회원가입이 완료되었습니다!");
        }
        location.href = "index.html";
    }
}

    </script>

</body>
</html>
