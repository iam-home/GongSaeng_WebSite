<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../CSS/main.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../JS/Login.js"></script>
    <title>공생</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">

    <div class="cancel-button">
      <button onclick="location.href=fromSource">X</button>
    </div>

    <div class="complete-button">
      <button id="register" onclick="GO()">완료</button>
    </div>

    </nav>
    
    <div class="write">
        <input id="admin" type="text" placeholder="제목을 입력하세요">
        <textarea name="content-input" id="bodyValue" oninput="autoResize(this)" placeholder="내용을 입력하세요"></textarea>
    </div>



    <script>
        let editId = null;
        let fromSource = null;

    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
    }

    document.addEventListener("DOMContentLoaded", async () => {
    const urlParams = new URLSearchParams(window.location.search);
    editId = urlParams.get('id');
    fromSource = urlParams.get('from');

    if (editId) {
        document.querySelector("#register").innerHTML = "수정 완료";
        await loadExistingData(editId);
    }
    
    if (fromSource === '01_ToDo.html') document.querySelector("#admin").style.display = "block";
    if (fromSource === '02_TimeLine.html') document.querySelector("#admin").style.display = "none";
    else if (fromSource === '03_Suggest.html') document.querySelector("#admin").style.display = "none";

});


async function loadExistingData(id) {
    //const targetTable = fromSource || 'Suggest'; // 이게 뭐임?
    const { data, error } = await client.from('Suggest').select('*').eq('id', id).single();

    if (data) {
        document.querySelector("#bodyValue").value = data.body;
        autoResize(document.querySelector("#bodyValue"));
    }
}

    async function GO() {
    const { data: { session } } = await client.auth.getSession();
    const title = document.querySelector("#admin").value;
    const body = document.querySelector("#bodyValue").value;
    
    if (body.trim() === "") {
        alert("내용을 입력해주세요");
        return;
    }

    let tableName = "";
    let redirectUrl = "";
    let dataToInsert = {};

    if (fromSource === '01_ToDo.html') {
        tableName = 'ToDo';
        redirectUrl = '01_ToDo.html';
        dataToInsert = { title: title, body: body };
    } 
    else if (fromSource === '02_TimeLine.html') {
        tableName = 'TimeLine';
        redirectUrl = '02_TimeLine.html';
        dataToInsert = { body: body };
    } 
    else if (fromSource === '03_Suggest.html') {
        tableName = 'Suggest';
        redirectUrl = '03_Suggest.html';
        dataToInsert = { body: body, user_id: session.user.id };
    }
    
    if (fromSource === '01_ToDo.html') {
        if (title.trim() === "") {
            alert("제목을 입력해주세요");
            return;
        }
    }

    if (editId) {
        const { error } = await client.from(tableName).update(dataToInsert).eq('id', editId);
        if (!error) {
            alert("수정되었습니다!");
            location.href = redirectUrl;
        }
    } else {
        const { error } = await client.from(tableName).insert([dataToInsert]);
        if (!error) {
            alert("등록되었습니다!");
            location.href = redirectUrl;
        } else {
            console.error("에러 발생:", error.message);
            alert("저장에 실패했습니다.");
        }
    }
}

    </script>

</body>
</html>
