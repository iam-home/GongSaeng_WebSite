<script>

async function SuggestDB() {
const { data: { session } } = await client.auth.getSession();
const adminEmails = ["SCRET_REMOVED"];
const isAdmin = session && adminEmails.includes(session.user.email);
const currentUserId = session?.user?.id;

const { data, error } = await client.from('Suggest').select('*');

let tag = "";
for (let i = 0; i < data.length; i++) {
const isOwner = currentUserId === data[i].user_id;
const myPostClass = isOwner ? "my-post" : "";

tag += `
<div class="post-item ${myPostClass}" style="position: relative; margin: 20px 0; border: 1px solid #ddd; padding: 15px;">
<p>${data[i].body}</p>

<div class="menu-container" style="position: absolute; top: 10px; right: 10px;">
<button onclick="toggleMenu(event, ${i})" style="border:none; background:none; cursor:pointer; font-size:20px;">⋮</button>

<div id="menu-${i}" class="dropdown-menu" style="display:none; position: absolute; right: 0; background: white; border: 1px solid #ccc; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); z-index: 10; min-width: 80px;">

${isOwner ? `
<button onclick="updateSuggest(${data[i].id})" style="display:block; width:100%; padding: 8px 10px; border:none; background:none; cursor:pointer; text-align: left;">수정</button>
` : ''}

${(isOwner || isAdmin) ? `
<button onclick="deleteSuggest(${data[i].id})" style="display:block; width:100%; padding: 8px 10px; border:none; background:none; cursor:pointer; color:red; text-align: left;">삭제</button>
` : ''}
</div>
</div>
</div>`;
}
document.querySelector("#Data").innerHTML = tag;
}
SuggestDB()

window.toggleMenu = function(event, index) {
event.stopPropagation();
const menu = document.getElementById(`menu-${index}`);

document.querySelectorAll('.dropdown-menu').forEach(m => {
if(m !== menu) m.style.display = 'none';
});

menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
};

document.addEventListener('click', () => {
document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');
});

async function deleteSuggest(id) {
if (!confirm("정말 삭제하시겠습니까?")) return;

const { error } = await client.from('Suggest').delete().eq('id', id);

if (error) {
alert("삭제 실패: " + error.message);
} else {
alert("삭제되었습니다.");
SuggestDB();
}
}

async function updateSuggest(id) {
location.href = `WRITE.html?id=${id}&from=Suggest`;
}

async function 로그인했냐() {
const isLogin = await checkLogin();

if (!isLogin && !location.href.includes('../index.html')) {
location.href = '/';
alert("로그인한 사용자만 이용할 수 있는 페이지입니다.");
return;
}

  
}
